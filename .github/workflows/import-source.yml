name: Import SI QUEST source archive
on:
  push:
    paths:
      - '.github/workflows/import-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate and extract private source archive
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          import shutil, stat
          source=Path('SI_QUEST_CYCLE_27_GITHUB_SOURCES.zip')
          if not source.is_file():
              raise SystemExit('Source ZIP missing: abort without commit')
          with ZipFile(source) as z:
              members=z.infolist()
              if len(members)>1000:
                  raise SystemExit('Too many ZIP entries')
              total=0
              for info in members:
                  p=PurePosixPath(info.filename)
                  if p.is_absolute() or '..' in p.parts or not p.parts:
                      raise SystemExit('Unsafe ZIP path: '+info.filename)
                  if (info.external_attr >> 16) & 0o170000 == stat.S_IFLNK:
                      raise SystemExit('Symlink ZIP entry refused: '+info.filename)
                  total+=info.file_size
                  if info.file_size>12_000_000 or total>40_000_000:
                      raise SystemExit('ZIP expanded size exceeds limit')
              z.extractall('/tmp/siquest-import')
          root=Path('/tmp/siquest-import')
          src=root/'SI_QUEST' if (root/'SI_QUEST'/'src').exists() else root
          for name in ('index.html','play.html','src','assets','sw.js','manifest.webmanifest'):
              if not (src/name).exists():
                  raise SystemExit('Required source missing: '+name)
          for name in ('index.html','play.html','src','assets','tests','sw.js','manifest.webmanifest','QUALITY.md','mondes'):
              p=src/name
              if not p.exists(): continue
              target=Path(name)
              if p.is_dir():
                  shutil.copytree(p,target,dirs_exist_ok=True)
              else:
                  shutil.copy2(p,target)
          print('Imported validated source archive; GitHub Pages not enabled')
          PY
      - name: Scientific smoke on imported source
        run: |
          node - <<'JS'
          const assert=require('node:assert/strict');
          const C=require('./src/catalog.js'),P=require('./src/physics.js'),Coach=require('./src/coaching.js');
          assert.ok(C.levels.length>=10);
          assert.equal(new Set(C.levels.map(x=>x.id)).size,C.levels.length);
          assert.equal(new Set(C.levels.map(x=>x.type)).size,C.levels.length);
          for(const level of C.levels) {
            const result=Coach.solve(level,P);
            assert.ok(result.steps.length>=3 && result.value>=level.input.min && result.value<=level.input.max);
          }
          console.log('Imported levels checked:',C.levels.length);
          JS
          if compgen -G 'tests/*.test.cjs' >/dev/null; then node --test tests/*.test.cjs; fi
      - name: Commit source to private main branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html play.html src assets sw.js manifest.webmanifest
          if [ -d tests ]; then git add tests; fi
          if [ -f QUALITY.md ]; then git add QUALITY.md; fi
          if [ -d mondes ]; then git add mondes; fi
          git diff --cached --quiet || git commit -m 'chore: import cycle 27 sources and scientific tests'
          git push
