name: SI QUEST scientific quality
on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/science.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  science:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          for file in src/*.js; do node --check "$file"; done
      - name: Independent scientific tests
        run: node --test tests/*.test.cjs
      - name: Catalog consistency
        run: |
          node - <<'JS'
          const assert=require('node:assert/strict');
          const C=require('./src/catalog.js'),P=require('./src/physics.js'),Coach=require('./src/coaching.js');
          assert.equal(C.worlds.length,17);
          assert.equal(new Set(C.levels.map(l=>l.id)).size,C.levels.length);
          assert.equal(new Set(C.levels.map(l=>l.type)).size,C.levels.length);
          for(const level of C.levels) {
            const solution=Coach.solve(level,P);
            assert.ok(solution.value>=level.input.min && solution.value<=level.input.max);
          }
          console.log('Scientific catalog checked:',C.levels.length,'missions');
          JS
