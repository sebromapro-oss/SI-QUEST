name: Recette accueil et missions navigateurs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html','src/home.js','src/style.css','src/catalog.js','assets/**','missions/**','src/investigation-mission.js','src/scene3d.js','src/mission.css','tests/accueil-browser.spec.cjs','tests/mission-browser.spec.cjs','.github/workflows/accueil-browser.yml']
permissions:
  contents: read
jobs:
  browser-recipe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Playwright et Chromium
        run: |
          npm install --no-save @playwright/test@1.58.2
          npx playwright install --with-deps chromium
      - name: Démarrer le serveur statique
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/siquest-server.log 2>&1 &
          sleep 2
      - name: Recette accueil et missions — bureau et émulation mobile
        run: npx playwright test tests/accueil-browser.spec.cjs tests/mission-browser.spec.cjs --reporter=line
      - name: Archiver captures et résultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: siquest-accueil-recette
          path: |
            artifacts/
            test-results/
          if-no-files-found: ignore
